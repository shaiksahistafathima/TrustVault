{% extends "base.html" %}
{% block title %}Authentication Required (401) — TrustVault{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-12 text-center bg-slate-950 p-8 rounded-xl border border-slate-800">
    <div class="text-4xl mb-3">🔑</div>
    <h1 class="text-2xl font-bold text-white">401 — Authentication Required</h1>
    <p class="text-sm text-slate-400 mt-2">You must sign in with a valid account to reach this resource.</p>
    <div class="mt-6">
        <a href="{{ url_for('auth.login') }}" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs text-white font-medium transition">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
