
{% extends "base.html" %}

{% block title %}Sign In — TrustVault{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-slate-950 p-8 rounded-xl border border-slate-800 shadow-2xl">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold tracking-tight text-white">TrustVault Access</h1>
        <p class="text-sm text-slate-400 mt-1">Authenticate to reach encrypted documents</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="email" class="block text-sm font-medium text-slate-300 mb-1">
                Email Address
            </label>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500"
                placeholder="Enter your email"
            >
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-slate-300 mb-1">
                Password
            </label>
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500"
                placeholder="Enter your password"
            >
        </div>

        <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition"
        >
            Sign In
        </button>
    </form>

    <!-- Create Account link -->
    <div class="mt-5 text-center">
        <p class="text-sm text-slate-400">
            Don't have an account?
            <a
                href="{{ url_for('auth.register') }}"
                class="text-indigo-400 hover:text-indigo-300 font-medium"
            >
                Create Account
            </a>
        </p>
    </div>

    {% if show_demo_accounts %}
    <div class="mt-8 pt-6 border-t border-slate-800">
        <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 text-center">
            One-Click Seed Accounts (For Evaluators)
        </p>

        <div class="space-y-2">
            <button
                type="button"
                onclick="fillLogin('admin@trustvault.local', 'AdminSecure2026!')"
                class="w-full text-left px-3 py-2 bg-slate-900 hover:bg-slate-800 rounded text-xs text-slate-300 border border-slate-800"
            >
                <span class="text-indigo-400 font-bold">ADMIN</span>
                — admin@trustvault.local
            </button>

            <button
                type="button"
                onclick="fillLogin('owner@trustvault.local', 'OwnerSecure2026!')"
                class="w-full text-left px-3 py-2 bg-slate-900 hover:bg-slate-800 rounded text-xs text-slate-300 border border-slate-800"
            >
                <span class="text-emerald-400 font-bold">OWNER</span>
                — owner@trustvault.local
            </button>

            <button
                type="button"
                onclick="fillLogin('viewer@trustvault.local', 'ViewerSecure2026!')"
                class="w-full text-left px-3 py-2 bg-slate-900 hover:bg-slate-800 rounded text-xs text-slate-300 border border-slate-800"
            >
                <span class="text-amber-400 font-bold">VIEWER</span>
                — viewer@trustvault.local
            </button>

            <button
                type="button"
                onclick="fillLogin('outsider@trustvault.local', 'OutsiderSecure2026!')"
                class="w-full text-left px-3 py-2 bg-slate-900 hover:bg-slate-800 rounded text-xs text-slate-300 border border-slate-800"
            >
                <span class="text-rose-400 font-bold">OUTSIDER</span>
                — outsider@trustvault.local
            </button>
        </div>
    </div>
    {% endif %}

</div>

<script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
{% endblock %}
